version: 2
updates:
  # Version-update PRs disabled (open-pull-requests-limit: 0).
  # Security PRs are unaffected by this limit and still open automatically.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # astro check requires TypeScript 6.x; TS 7+ (native compiler) lacks the API it needs.
      # See https://github.com/withastro/roadmap/discussions/1321 - drop this once Astro supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
