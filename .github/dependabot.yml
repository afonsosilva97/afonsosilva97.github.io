version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all-npm-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # astro check requires TypeScript 6.x; TS 7+ (native compiler) lacks the API it needs.
      # See https://github.com/withastro/roadmap/discussions/1321 - drop this once Astro supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
