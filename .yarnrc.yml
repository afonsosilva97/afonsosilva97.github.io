nodeLinker: node-modules

# Supply-chain hardening (yarn 4.14+ defaults, made explicit)
# Block git dependencies entirely — this project uses none.
approvedGitRepositories: []

# Disable postinstall scripts globally. esbuild/sharp ship prebuilt
# binaries via optional dependencies, so nothing here needs them.
enableScripts: false

# Refuse to install package versions younger than 3 days (in minutes).
# Mitigates compromised-release attacks; Dependabot PRs arrive later anyway.
npmMinimalAgeGate: 4320
